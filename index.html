<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra mẫu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #E9ECEE;        /* sample-room grey */
    --surface: #FFFFFF;
    --ink: #17222D;
    --ink-2: #5A6673;
    --line: #D3D8DD;
    --navy: #1D3B57;
    --pass: #2E7D4F;      /* approved / OK tag */
    --fail: #C2362B;      /* rejected / late tag */
    --wait: #B7791F;      /* anything else that looks like a status */
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181E; --surface: #1B232B; --ink: #E7ECF0; --ink-2: #98A4AF; --line: #2C3742;
      --navy: #8CB4D8; --pass: #5BBF85; --fail: #F0776C; --wait: #E3AE57;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  button, input { font-family: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 15px/1.5 'Be Vietnam Pro', system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

  /* search bar stays on screen while scrolling results */
  .top { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 0 10px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; color: var(--navy); }
  .sync { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; text-align: right; }
  .sync button:disabled { opacity: .5; cursor: default; }
  .sync button {
    font: inherit; font-weight: 600; color: var(--navy); background: none; border: 0; padding: 4px 2px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .search { position: relative; }
  .search input {
    width: 100%; font-weight: 600; font-size: 22px; line-height: 1.2; color: var(--ink);
    padding: 14px 48px 14px 16px; border: 2px solid var(--navy); border-radius: var(--radius);
    background: var(--surface); outline: none; letter-spacing: 0.01em;
  }
  .search input::placeholder { color: var(--ink-2); font-weight: 400; font-size: 17px; letter-spacing: 0; }
  .search input:focus-visible { box-shadow: 0 0 0 4px color-mix(in srgb, var(--navy) 25%, transparent); }
  .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border: 0; border-radius: 8px; background: none; color: var(--ink-2);
    font-size: 22px; cursor: pointer;
  }
  .clear[hidden] { display: none; }
  .filters { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .filters button {
    flex: none; font-weight: 500; font-size: 14px; line-height: 1; color: var(--ink); cursor: pointer;
    padding: 9px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  }
  .filters button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--surface); }
  .filters b { font-weight: 700; margin-left: 4px; }

  main { padding: 6px 0 48px; }
  .note { color: var(--ink-2); margin: 18px 0; }
  .warn { color: var(--fail); font-size: 14px; margin: 8px 0; }

  .recent { margin: 18px 0; }
  .recent p { margin: 0 0 8px; color: var(--ink-2); }
  .recent button {
    font-weight: 600; font-size: 15px; line-height: 1; color: var(--navy); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin: 0 6px 6px 0; cursor: pointer;
  }

  /* one sheet = one block; rows inside read like a lookup list, not separate cards */
  .grp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin: 16px 0; overflow: hidden; }
  h2 {
    margin: 0; padding: 10px 14px; font-size: 15px; font-weight: 700; color: var(--ink);
    display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line);
  }
  h2 .n { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  h2 a { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--navy); text-decoration: none; padding: 4px 0; }
  h2 a:hover, h2 a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }

  .hit + .hit { border-top: 1px solid var(--line); }
  .hit summary {
    list-style: none; cursor: pointer; padding: 11px 14px 11px 16px; align-items: start;
    display: grid; grid-template-columns: 7.5rem 1fr auto 14px; gap: 2px 14px;
    box-shadow: inset 4px 0 0 var(--tag, transparent); /* status colour on the edge, like a tag on the sample */
  }
  .pass { --tag: var(--pass); } .fail { --tag: var(--fail); } .wait { --tag: var(--wait); }
  .hit summary:hover { background: color-mix(in srgb, var(--navy) 5%, transparent); }
  .hit summary::-webkit-details-marker { display: none; }
  .hit summary:focus-visible { outline: 3px solid var(--navy); outline-offset: -3px; }
  /* the typed part is already known: show it at full ink, the rest of the code dimmer */
  .code { font-size: 16px; font-weight: 700; line-height: 1.4; color: var(--ink-2); overflow-wrap: anywhere; }
  .code mark { background: none; color: var(--ink); }
  .body { min-width: 0; }
  .name { display: block; font-weight: 500; color: var(--ink); line-height: 1.4; }
  .meta { display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 13px; color: var(--ink-2); }
  .meta b { font-weight: 600; color: var(--ink); }
  .status { font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--tag); line-height: 1.6; }
  .chev {
    width: 8px; height: 8px; margin-top: 7px; border: solid var(--ink-2); border-width: 0 2px 2px 0;
    transform: rotate(45deg); justify-self: center;
  }
  .hit[open] .chev { transform: rotate(-135deg); margin-top: 11px; }
  .hit[open] summary { background: color-mix(in srgb, var(--navy) 5%, transparent); }

  dl {
    margin: 0; padding: 4px 14px 12px calc(16px + 7.5rem + 14px);
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); column-gap: 24px;
  }
  dl div { display: grid; grid-template-columns: 9rem 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  dt { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; color: var(--ink); }
  .more { font-weight: 600; font-size: 14px; line-height: 1; color: var(--navy); background: none; border: 0; border-top: 1px solid var(--line); width: 100%; padding: 13px; cursor: pointer; }

  @media (max-width: 600px) {
    .hit summary { grid-template-columns: 1fr auto 14px; }
    .code { grid-area: 1 / 1; } .status { grid-area: 1 / 2; } .chev { grid-area: 1 / 3; }
    .body { grid-column: 1 / -1; grid-row: 2; }
    dl { padding-left: 16px; grid-template-columns: 1fr; }
    dl div { grid-template-columns: 8rem 1fr; }
  }
  @media (min-width: 700px) {
    .top { padding-top: 24px; }
    .brand h1 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .hit[open] dl { animation: open .18s ease-out; }
    @keyframes open { from { opacity: 0; transform: translateY(-4px); } }
  }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand">
    <h1>Tra mẫu</h1>
    <div class="sync"><span id="sync" aria-live="polite">Đang tải…</span><button id="reload" type="button">Tải lại</button></div>
  </div>
  <div class="search">
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters" spellcheck="false"
      placeholder="Mã style hoặc mã vật tư CM#" aria-label="Mã style hoặc mã vật tư CM#">
    <button class="clear" id="clear" type="button" aria-label="Xoá" hidden>×</button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Lọc theo khách hàng"></div>
</div></div>
<main class="wrap" id="out" aria-live="polite"></main>
<script>
// Each source: one Google Sheet tab. keys = header names matched against the query;
// the header row is the first of the top 5 rows containing a key, so inserted title rows don't break it.
const F2 = '1yQNURTEAMJxPhurKf7qxwzRnAn3nwvgUrveI-qpTHoE', F3 = '1qGbrPanMBZNVP6lWBh3ETSLl8Pu7Ijo-7WfpsObHSic',
      F4 = '1TgY4elXf5Z_X2yrzfzdVgSkBGXqgJQ-ePBMlwlER0-Y', F5 = '1Kf5hLfhd7y3b9wPnAr9ftTrvxnkVJNCwjTp8oCsFfUE',
      F6 = '1w7Yxed6J_VvxTdZTy5w7WoAeti8UbD5I55zK86KAqwI';
const SOURCES = [
  { group: 'coach', name: 'Theo dõi PA (DATA)', id: F2, gid: '1363034961', keys: ['STYLE'] },
  { group: 'coach', name: 'Theo dõi reject', id: F2, gid: '849460225', keys: ['STYLE'] },
  { group: 'coach', name: 'PA list', id: F2, gid: '558887054', keys: ['Style'] },
  { group: 'coach', name: 'Theo dõi túi PA', id: F2, gid: '1041297598', keys: ['MÃ'] },
  { group: 'coach', name: 'PA Coach', id: F3, gid: '201883774', keys: ['Style'] },
  { group: 'coach', name: 'PA Kate Spade', id: F3, gid: '205650717', keys: ['Style'] },
  { group: 'travel', name: 'Danh sách PO', id: F4, gid: '1491559955', keys: ['Style', 'Style + Grid'] },
  { group: 'travel', name: 'PPS List', id: F4, gid: '2097556221', keys: ['Style', 'Style + Grid'] },
  { group: 'travel', name: 'PPS TL', id: F6, gid: '1577043958', keys: ['Style'] },
  { group: 'travel', name: 'PA list (Travel)', id: F5, gid: '715633471', keys: ['Style', 'Style + Grid'] },
  { group: 'travel', name: 'Vật tư Miền Đông', id: F5, gid: '1131181694', keys: ['CM#'] },
  { group: 'travel', name: 'Vật tư Trà Vinh', id: F5, gid: '1057713774', keys: ['CM#'] },
];
const GROUPS = [['all', 'Tất cả'], ['coach', 'Coach / Kate Spade'], ['travel', 'Travel / Golf']];
const NAME = ['STYLE NAME', 'Style Name', 'Style name'];
const META = ['Buy', 'BUY', 'PLAN MONTH', 'TEAM', 'NHÀ MÁY', 'NGÀY NHẬN TÚI', 'Reference PO # (VBD PO)', 'ĐVT', 'Grand Total'];
// Status = first of these columns (in this order) with a short value; LATE columns add a "trễ" note.
const STATUS = ['DUYỆT PA', 'Approval Status', 'NOTE', 'TV NHẬN', 'MĐ NHẬN'];
const LATE = ['Tính Ontime/Late', 'Ontime', 'KQ Ontime'];
const FAIL = /reject|không đạt/i, PASS = /^approv(al|ed)$|^ok$|^đạt$|^đã duyệt$/i;
const PAGE = 30, RECENT_KEY = 'tracuu.recent';

const $ = id => document.getElementById(id);
const $q = $('q'), $out = $('out'), $sync = $('sync'), $filters = $('filters'), $clear = $('clear');
const clean = h => h.replace(/\s+/g, ' ').trim();
const norm = s => String(s || '').trim().toUpperCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const colName = i => { let s = ''; for (i++; i; i = (i - 1) / 26 | 0) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
let group = 'all', shown = {}, loading = true, loaded = 0, lastTotal = 0;
const opened = new Map(); // card id -> open/closed as the user left it, kept across re-renders

const RETRY_WAIT = [2000, 5000, 10000], CACHE_MS = 3 * 60 * 1000;
// IndexedDB, not localStorage: the sheets are ~5MB of text, which fills localStorage's quota and breaks recent searches.
const idb = (mode, op) => new Promise((resolve, reject) => {
  const open = indexedDB.open('tracuu', 1);
  open.onupgradeneeded = () => open.result.createObjectStore('csv');
  open.onerror = () => reject(open.error);
  open.onsuccess = () => {
    const db = open.result;
    try { // a throw in this callback would otherwise leave the promise pending forever
      const tx = db.transaction('csv', mode);
      tx.oncomplete = tx.onabort = () => db.close(); // an open connection would block a future version upgrade
      const req = op(tx.objectStore('csv'));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { db.close(); reject(e); }
  };
});
const cacheKey = src => `${src.id}.${src.gid}`;
// Drop cached tabs no longer in SOURCES; put() overwrites the rest, so the cache stays at one copy per tab.
const pruneCache = () => idb('readonly', s => s.getAllKeys()).then(keys => {
  const keep = new Set(SOURCES.map(cacheKey));
  keys.filter(k => !keep.has(k)).forEach(k => idb('readwrite', s => s.delete(k)).catch(() => {}));
}).catch(() => {});

// Google's 429 usually comes without CORS headers, so it surfaces as a network TypeError, not res.status.
async function fetchCSV(src, force) {
  const key = cacheKey(src);
  if (!force) try {
    const c = await idb('readonly', s => s.get(key));
    const age = c ? Date.now() - c.at : -1;
    if (age >= 0 && age < CACHE_MS) { src.at = c.at; return c.text; } // age < 0: clock moved back since caching, don't trust it
  } catch {} // no IndexedDB (private mode, blocked storage): just fetch
  const url = `https://docs.google.com/spreadsheets/d/${src.id}/export?format=csv&gid=${src.gid}`;
  for (let attempt = 0; ; attempt++) {
    let err, retryable = true;
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) {
        const text = await res.text();
        src.at = Date.now();
        idb('readwrite', s => s.put({ at: src.at, text }, key)).catch(() => {}); // caching is best-effort, don't wait on it
        return text;
      }
      err = new Error('HTTP ' + res.status);
      retryable = res.status === 429 || res.status >= 500; // other 4xx (sheet made private, deleted) won't fix itself
    } catch (e) { err = e; } // network error, incl. a 429 hidden by missing CORS headers
    if (!retryable || attempt >= RETRY_WAIT.length) throw err;
    $sync.textContent = `Đang thử lại ${src.name} (${attempt + 1}/${RETRY_WAIT.length})…`;
    await new Promise(r => setTimeout(r, RETRY_WAIT[attempt] * (0.8 + Math.random() * 0.4))); // jitter so the office doesn't retry in lockstep
  }
}

async function load(force) {
  loading = true;
  loaded = 0;
  opened.clear(); // ids are row positions, which may shift after a reload
  $('reload').disabled = true;
  $sync.textContent = `Đang tải 0/${SOURCES.length} bảng…`;
  await Promise.all(SOURCES.map(async src => {
    try {
      const rows = Papa.parse(await fetchCSV(src, force)).data;
      const hr = rows.slice(0, 5).findIndex(r => r.some(h => src.keys.includes(clean(h))));
      if (hr < 0) throw new Error('không thấy cột ' + src.keys.join('/'));
      const h = rows[hr].map((x, i) => clean(x) || 'Cột ' + colName(i));
      const first = list => list.map(k => h.indexOf(k)).filter(i => i >= 0);
      Object.assign(src, { headers: h, keyIdx: first(src.keys), nameIdx: first(NAME)[0], metaIdx: first(META).slice(0, 2),
        statusIdx: first(STATUS), lateIdx: first(LATE)[0], rows: rows.slice(hr + 1), error: null });
    } catch (e) {
      src.rows = [];
      src.at = null;
      src.error = e instanceof TypeError ? 'Google chặn tạm hoặc sheet không còn chia sẻ công khai' : e.message;
    }
    $sync.textContent = `Đang tải ${++loaded}/${SOURCES.length} bảng…`;
    render(); // show results as each tab arrives
  }));
  loading = false;
  $('reload').disabled = false;
  const n = SOURCES.reduce((s, x) => s + x.rows.length, 0).toLocaleString('vi-VN');
  const at = Math.min(...SOURCES.map(x => x.at || Date.now())); // oldest tab, so cached data doesn't look fresher than it is
  $sync.textContent = `${n} dòng, cập nhật ${new Date(at).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}`;
  render();
}

function statusOf(src, row) {
  const late = src.lateIdx !== undefined && /^late$/i.test(clean(row[src.lateIdx] || '')) ? ', trễ' : '';
  for (const i of src.statusIdx) {
    const t = clean(row[i] || '');
    if (!t || t === '-' || t.length > 20) continue; // long free-text notes are not a status
    return [FAIL.test(t) ? 'fail' : PASS.test(t) ? 'pass' : 'wait', t + late];
  }
  return [late ? 'wait' : '', late ? 'Trễ' : ''];
}

function highlight(text, q) {
  const i = norm(text).indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function search(q) {
  return SOURCES.filter(s => s.rows && s.rows.length).map(src => {
    const hits = [];
    src.rows.forEach((r, i) => {
      const k = src.keyIdx.find(c => norm(r[c]).includes(q));
      if (k !== undefined) hits.push({ r, k, id: src.gid + ':' + i, exact: norm(r[k]) === q });
    });
    hits.sort((a, b) => b.exact - a.exact);
    return { src, hits };
  }).filter(x => x.hits.length);
}

function hitHTML(src, { r, k, id }, q, open) {
  const [cls, label] = statusOf(src, r);
  const name = src.nameIdx !== undefined ? r[src.nameIdx] : '';
  const meta = src.metaIdx.filter(i => clean(r[i] || '')).map(i => `${esc(src.headers[i])}: <b>${esc(clean(r[i]))}</b>`);
  const fields = r.map((v, i) => (v = (v || '').trim()) && v !== '-'
    ? `<div><dt>${esc(src.headers[i] || 'Cột ' + colName(i))}</dt><dd>${esc(v)}</dd></div>` : '').join('');
  return `<details class="hit ${cls}" data-id="${id}"${opened.has(id) ? (opened.get(id) ? ' open' : '') : open ? ' open data-auto' : ''}><summary>
    <span class="code">${highlight(clean(r[k]), q)}</span>
    <span class="body">${name ? `<span class="name">${esc(clean(name))}</span>` : ''}<span class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</span></span>
    <span class="status">${esc(label)}</span><span class="chev" aria-hidden="true"></span>
  </summary><dl>${fields}</dl></details>`;
}

function render() {
  const raw = $q.value.trim(), q = norm(raw);
  $clear.hidden = !raw;
  const url = new URL(location.href);
  raw ? url.searchParams.set('q', raw) : url.searchParams.delete('q');
  history.replaceState(null, '', url);

  const results = q.length >= 2 ? search(q) : [];
  const count = g => results.filter(x => g === 'all' || x.src.group === g).reduce((n, x) => n + x.hits.length, 0);
  $filters.innerHTML = GROUPS.map(([g, label]) =>
    `<button type="button" data-g="${g}" aria-pressed="${g === group}">${label}${q.length >= 2 ? `<b>${count(g)}</b>` : ''}</button>`).join('');

  const failed = SOURCES.filter(s => s.error && (group === 'all' || s.group === group));
  let html = failed.length ? `<p class="warn">Không tải được ${esc(failed.map(s => s.name).join(', '))}, kết quả có thể thiếu. Bấm Tải lại để thử lại.</p>` : '';

  if (q.length < 2) {
    lastTotal = 0;
    const recent = getRecent();
    html += `<p class="note">Gõ mã style (vd. CDT65, 28464) hoặc mã vật tư CM# (vd. H-VB30373). Gõ một phần mã cũng được.</p>`;
    if (recent.length) html += `<div class="recent"><p>Tra gần đây</p>${recent.map(r => `<button type="button" data-q="${esc(r)}">${esc(r)}</button>`).join('')}</div>`;
    $out.innerHTML = html;
    return;
  }

  const visible = results.filter(x => group === 'all' || x.src.group === group);
  if (loading && visible.length) html += `<p class="note">Đang tải ${loaded}/${SOURCES.length} bảng, kết quả có thể chưa đủ.</p>`;
  if (!visible.length) {
    html += loading ? '<p class="note">Đang tải dữ liệu, chờ chút…</p>'
      : `<p class="note">Không có mã nào chứa “${esc(raw)}”${group !== 'all' ? ' trong nhóm này. Thử chọn Tất cả.' : '. Kiểm tra lại mã, hoặc gõ ngắn hơn.'}</p>`;
  }
  const total = visible.reduce((n, x) => n + x.hits.length, 0);
  lastTotal = results.reduce((n, x) => n + x.hits.length, 0);
  for (const { src, hits } of visible) {
    const key = src.gid, n = shown[key] || PAGE;
    html += `<section class="grp"><h2>${esc(src.name)}<span class="n">${hits.length} dòng</span><a href="https://docs.google.com/spreadsheets/d/${src.id}/edit#gid=${src.gid}" target="_blank" rel="noopener">Mở sheet ↗</a></h2>`;
    html += hits.slice(0, n).map(h => hitHTML(src, h, q, total === 1)).join('');
    if (hits.length > n) html += `<button type="button" class="more" data-more="${key}">Xem thêm ${Math.min(PAGE, hits.length - n)} dòng (còn ${hits.length - n})</button>`;
    html += '</section>';
  }
  $out.innerHTML = html;
}

function getRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } }
function saveRecent(v) {
  if (norm(v).length < 3 || !lastTotal || loading) return; // only codes that actually found something
  try { localStorage.setItem(RECENT_KEY, JSON.stringify([v, ...getRecent().filter(x => norm(x) !== norm(v))].slice(0, 8))); } catch {}
}

function setQuery(v) { $q.value = v; shown = {}; opened.clear(); render(); }
let t, t2;
$q.addEventListener('input', () => {
  shown = {}; opened.clear();
  clearTimeout(t); t = setTimeout(render, 150);
  clearTimeout(t2); t2 = setTimeout(() => saveRecent($q.value.trim()), 1500);
});
$q.addEventListener('keydown', e => { if (e.key === 'Escape') setQuery(''); });
$clear.addEventListener('click', () => { setQuery(''); $q.focus(); });
$('reload').addEventListener('click', () => load(true)); // manual reload skips the cache
$filters.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  group = b.dataset.g; render();
  $filters.querySelector(`[data-g="${group}"]`).focus(); // render() replaced the button that had focus
});
$out.addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  if ('auto' in e.target.dataset) { delete e.target.dataset.auto; return; } // auto-open on a single hit is not a user choice
  opened.set(id, e.target.open);
}, true);
$out.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.q) { setQuery(b.dataset.q); $q.focus(); }
  if (b.dataset.more) { shown[b.dataset.more] = (shown[b.dataset.more] || PAGE) + PAGE; render(); }
});
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $q) { e.preventDefault(); $q.focus(); } });

$q.value = new URL(location.href).searchParams.get('q') || '';
render();
load();
pruneCache();
</script>
</body>
</html>
